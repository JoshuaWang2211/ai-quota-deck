[package]
name = "ai-quota-deck"
version = "0.2.1"
description = "Windows tray dashboard for Claude, Codex, Gemini, and Grok subscription quota."
authors = ["Joshua Wang"]
license = "MIT"
repository = "https://github.com/JoshuaWang2211/ai-quota-deck"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_quota_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls is SChannel on Windows: uses the OS trust store, no bundled roots.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
chrono = "0.4"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
